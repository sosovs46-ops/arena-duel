<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Арена: Дуэль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <style>
    :root {
      --bg-1: #d4b896;
      --bg-2: #e8d4a8;
      --bg-3: #c9a876;
      --panel: #f4e4bc;
      --brown: #2b1810;
      --wood: #8b5a2b;
      --red: #8b0000;
      --gold: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background:
        repeating-linear-gradient(0deg, rgba(139,90,43,.04), rgba(139,90,43,.04) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(139,90,43,.04), rgba(139,90,43,.04) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at center, var(--bg-2) 0%, var(--bg-3) 100%);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: min(900px, 100%);
      background: linear-gradient(135deg, #f4e4bc 0%, #e8d4a8 50%, #d4b896 100%);
      border: 6px solid var(--brown);
      border-radius: 16px;
      box-shadow: 0 0 0 3px var(--wood), 0 0 0 8px var(--brown), 0 20px 60px rgba(0,0,0,.45);
      padding: 28px;
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(43,24,16,.35);
      border-radius: 10px;
      pointer-events: none;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    h1, h2, .btn, .title-fancy {
      font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 1px;
    }

    h1 {
      text-align: center;
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 14px;
      color: var(--brown);
    }

    h2 {
      text-align: center;
      color: var(--red);
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      margin-bottom: 24px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: var(--brown);
      opacity: 0.9;
    }

    .panel {
      background: rgba(255,255,255,0.15);
      border: 3px solid var(--brown);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .role-selector, .mode-selector, .difficulty-selector {
      display: grid;
      gap: 16px;
    }

    .role-selector { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .role-btn, .mode-btn, .difficulty-btn, .btn, .option-btn {
      border: 3px solid var(--brown);
      border-radius: 10px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      font-size: 1rem;
    }

    .role-btn, .mode-btn, .difficulty-btn {
      background: linear-gradient(135deg, #f9f1d4 0%, #e9d6a5 100%);
      color: var(--brown);
      padding: 22px 18px;
      box-shadow: 4px 4px 0 var(--brown);
      min-height: 90px;
    }

    .role-btn:hover, .mode-btn:hover, .difficulty-btn:hover, .btn:hover, .option-btn:hover {
      transform: translate(-2px, -2px);
    }

    .mode-title, .difficulty-title {
      font-size: 1.35rem;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--red);
    }

    .mode-desc { font-size: 0.9rem; }

    .difficulty-btn.easy { border-color: #2d5016; box-shadow: 4px 4px 0 #2d5016; }
    .difficulty-btn.hard { border-color: #b8860b; box-shadow: 4px 4px 0 #b8860b; }
    .difficulty-btn.impossible { border-color: #8b0000; box-shadow: 4px 4px 0 #8b0000; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 3px solid var(--brown);
      border-radius: 8px;
      background: var(--panel);
      color: var(--brown);
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--red) 0%, #5a0505 100%);
      color: white;
      box-shadow: 4px 4px 0 var(--brown);
      margin-top: 10px;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #eed8a6 0%, #d8b777 100%);
      color: var(--brown);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #2b1810 0%, #5b3828 100%);
      border: 4px solid var(--brown);
      border-radius: 12px;
      padding: 16px 18px;
      color: white;
      margin-bottom: 18px;
    }

    .player-score {
      text-align: center;
      flex: 1;
    }

    .player-name {
      font-size: 1.1rem;
      color: #f4e4bc;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .score {
      font-size: 2.2rem;
      color: var(--gold);
      font-weight: 700;
    }

    .vs {
      font-size: 1.8rem;
      color: var(--red);
      padding: 0 10px;
      font-weight: 700;
    }

    .timer {
      text-align: center;
      font-size: 2rem;
      margin: 16px 0;
      font-weight: 700;
      color: var(--red);
    }

    .question-box {
      border: 4px solid var(--brown);
      background: linear-gradient(135deg, #fffaf0 0%, #f4e4bc 100%);
      border-radius: 12px;
      padding: 20px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 18px;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      line-height: 1.6;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option-btn {
      background: linear-gradient(135deg, #fff8e7 0%, #f4e4bc 100%);
      color: var(--brown);
      padding: 16px 12px;
      text-align: left;
      box-shadow: 3px 3px 0 var(--brown);
    }

    .option-btn.correct { background: linear-gradient(135deg, #3e8f40, #2d5016); color: white; }
    .option-btn.wrong { background: linear-gradient(135deg, #9e1f1f, #5c0000); color: white; }
    .option-btn:disabled { opacity: 0.9; }

    .feedback {
      display: none;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 10px;
      border: 3px solid var(--brown);
    }

    .feedback.correct { display: block; background: linear-gradient(135deg, #3e8f40, #2d5016); color: white; }
    .feedback.wrong { display: block; background: linear-gradient(135deg, #9e1f1f, #5c0000); color: white; }

    .cloud-status {
      position: fixed;
      right: 14px;
      top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      border: 2px solid var(--brown);
      box-shadow: 2px 2px 0 var(--brown);
      background: #b8860b;
      color: white;
      z-index: 10;
    }
    .cloud-status.ok { background: #2d5016; }
    .cloud-status.err { background: #8b0000; }

    .teacher-info {
      margin-bottom: 18px;
      background: #fffaf0;
      border: 3px solid var(--brown);
      border-left: 8px solid var(--red);
      border-radius: 10px;
      padding: 16px;
    }

    .journal-list {
      max-height: 360px;
      overflow-y: auto;
      border: 3px solid var(--brown);
      border-radius: 10px;
      background: #fffaf0;
      padding: 14px;
    }

    .journal-entry {
      background: rgba(244,228,188,0.5);
      border-left: 4px solid var(--red);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      color: #6d4d2d;
      padding: 24px 10px;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .role-selector, .options-grid { grid-template-columns: 1fr; }
      .container { padding: 20px; }
      .scoreboard { gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="cloudStatus" class="cloud-status">⏳ Подключение...</div>

  <div class="container">
    <div id="mainScreen" class="screen active">
      <h1>���️ АРЕНА: ДУЭЛЬ ⚔️</h1>
      <p class="subtitle">~ Викторина для школы, уроков и Telegram Mini App ~</p>
      <div class="role-selector">
        <button class="role-btn" onclick="showScreen('studentScreen')">👨‍🎓 Ученик</button>
        <button class="role-btn" onclick="showScreen('teacherScreen')">👩‍🏫 Учитель</button>
      </div>
    </div>

    <div id="studentScreen" class="screen">
      <h2>Регистрация ученика</h2>
      <div class="panel">
        <div class="form-group">
          <label>Имя и фамилия</label>
          <input id="studentName" type="text" placeholder="Например: Иван Петров" />
        </div>
        <div class="form-group">
          <label>Класс</label>
          <input id="studentClass" type="text" placeholder="Например: 7А" />
        </div>
        <button class="btn" onclick="goToMode()">Далее</button>
        <button class="btn secondary" onclick="showScreen('mainScreen')">Назад</button>
      </div>
    </div>

    <div id="modeScreen" class="screen">
      <h2>Выбери режим</h2>
      <div class="mode-selector">
        <button class="mode-btn" onclick="showScreen('subjectScreen')">
          <div class="mode-title">🤖 Против бота</div>
          <div class="mode-desc">Одиночная дуэль с компьютером</div>
        </button>
        <button class="mode-btn" onclick="showScreen('duelScreen')">
          <div class="mode-title">👥 2 игрока</div>
          <div class="mode-desc">Дуэль на одном устройстве</div>
        </button>
      </div>
      <button class="btn secondary" onclick="showScreen('studentScreen')">Назад</button>
    </div>

    <div id="subjectScreen" class="screen">
      <h2>Выбери предмет</h2>
      <div class="panel">
        <div class="form-group">
          <label>Предмет</label>
          <select id="subjectSelect">
            <option value="math">Математика</option>
            <option value="russian">Русский язык</option>
            <option value="literature">Литература</option>
            <option value="history">История</option>
            <option value="biology">Биология</option>
            <option value="geography">География</option>
            <option value="physics">Физика</option>
            <option value="chemistry">Химия</option>
            <option value="english">Английский язык</option>
          </select>
        </div>
        <button class="btn" onclick="showScreen('difficultyScreen')">Далее</button>
        <button class="btn secondary" onclick="showScreen('modeScreen')">Назад</button>
      </div>
    </div>

    <div id="difficultyScreen" class="screen">
      <h2>Сложность</h2>
      <div class="difficulty-selector">
        <button class="difficulty-btn easy" onclick="startBotGame('easy')">
          <div class="difficulty-title">🟢 Легко</div>
          <div class="mode-desc">Бот прост, вопросы проще</div>
        </button>
        <button class="difficulty-btn hard" onclick="startBotGame('hard')">
          <div class="difficulty-title">🟠 Сложно</div>
          <div class="mode-desc">Бот быстрее и точнее</div>
        </button>
        <button class="difficulty-btn impossible" onclick="startBotGame('impossible')">
          <div class="difficulty-title">🔴 Невозможно</div>
          <div class="mode-desc">Максимально сложный режим</div>
        </button>
      </div>
      <button class="btn secondary" onclick="showScreen('subjectScreen')">Назад</button>
    </div>

    <div id="duelScreen" class="screen">
      <h2>2 игрока</h2>
      <div class="panel">
        <div class="form-group">
          <label>Имя игрока 1</label>
          <input id="player1Name" type="text" placeholder="Игрок 1" />
        </div>
        <div class="form-group">
          <label>Имя игрока 2</label>
          <input id="player2Name" type="text" placeholder="Игрок 2" />
        </div>
        <div class="form-group">
          <label>Предмет</label>
          <select id="duelSubject">
            <option value="math">Математика</option>
            <option value="russian">Русский язык</option>
            <option value="literature">Литература</option>
            <option value="history">История</option>
            <option value="biology">Биология</option>
            <option value="geography">География</option>
            <option value="physics">Физика</option>
            <option value="chemistry">Химия</option>
            <option value="english">Английский язык</option>
          </select>
        </div>
        <button class="btn" onclick="startDuelGame()">Начать дуэль</button>
        <button class="btn secondary" onclick="showScreen('modeScreen')">Назад</button>
      </div>
    </div>

    <div id="teacherScreen" class="screen">
      <h2>Вход учителя</h2>
      <div class="panel">
        <div class="form-group">
          <label>ФИО учителя</label>
          <input id="teacherName" type="text" placeholder="Имя учителя" />
        </div>
        <div class="form-group">
          <label>PIN-код</label>
          <input id="teacherPin" type="password" placeholder="1234" maxlength="4" />
        </div>
        <button class="btn" onclick="loginTeacher()">Войти</button>
        <button class="btn secondary" onclick="showScreen('mainScreen')">Назад</button>
      </div>
    </div>

    <div id="teacherPanel" class="screen">
      <h2>Журнал учителя</h2>
      <div class="teacher-info" id="teacherInfoBox"></div>
      <div class="panel">
        <input id="journalSearch" type="text" placeholder="Поиск по имени или классу" style="margin-bottom:12px;" oninput="renderJournal()" />
        <div id="journalList" class="journal-list"></div>
      </div>
      <button class="btn secondary" onclick="showScreen('mainScreen')">Выйти</button>
    </div>

    <div id="gameScreen" class="screen">
      <div class="scoreboard">
        <div class="player-score">
          <div class="player-name" id="player1Label">Игрок 1</div>
          <div class="score" id="player1Score">0</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-score">
          <div class="player-name" id="player2Label">Игрок 2</div>
          <div class="score" id="player2Score">0</div>
        </div>
      </div>

      <div class="timer" id="timer">15</div>
      <div class="question-box" id="questionText">Готовим вопрос...</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="feedbackBox" class="feedback"></div>
      <button class="btn secondary" onclick="showScreen('mainScreen')">Выйти</button>
    </div>

    <div id="resultScreen" class="screen">
      <h2>Итог</h2>
      <div class="panel" style="text-align:center;">
        <div id="winnerText" style="font-size:1.8rem; font-weight:700; color:var(--red); margin-bottom:16px;">Победитель</div>
        <div id="finalScoreText" style="font-size:1.1rem; margin-bottom:12px;"></div>
        <button class="btn" onclick="showScreen('mainScreen')">На главную</button>
      </div>
    </div>
  </div>

  <script>
    const SUBJECT_MAP = {
      math: 'Математика',
      russian: 'Русский язык',
      literature: 'Литература',
      history: 'История',
      biology: 'Биология',
      geography: 'География',
      physics: 'Физика',
      chemistry: 'Химия',
      english: 'Английский язык'
    };

    const QUESTION_BANK = {
      math: [
        { q: 'Сколько будет 12 × 8?', options: ['96', '84', '108', '72'], correct: 0 },
        { q: 'Чему равен 25% от 200?', options: ['25', '50', '75', '100'], correct: 1 },
        { q: 'Какое число делится на 9?', options: ['47', '81', '52', '13'], correct: 1 },
        { q: 'Решите: 7 + 5 × 2', options: ['24', '17', '14', '12'], correct: 1 }
      ],
      russian: [
        { q: 'Как правильно пишется?', options: ['светлые', 'светлые', 'светлые', 'светлые'], correct: 0 },
        { q: 'Что является главным членом предложения?', options: ['Определение', 'Дополнение', 'Подлежащее', 'Обстоятельство'], correct: 2 },
        { q: 'Какое слово является антонимом к слову «медленный»?', options: ['быстрый', 'тихий', 'трудный', 'лёгкий'], correct: 0 },
        { q: 'Какую роль в предложении выполняет сказуемое?', options: ['определяет предмет', 'сообщает действие', 'уточняет причину', 'сравнивает слова'], correct: 1 }
      ],
      literature: [
        { q: 'Кто написал «Евгения Онегина»?', options: ['А. Пушкин', 'Л. Толстой', 'Ф. Достоевский', 'М. Лермонтов'], correct: 0 },
        { q: 'Кто автор басни «Ворона и Лисица»?', options: ['И. Крылов', 'А. Пушкин', 'Н. Некрасов', 'Л. Толстой'], correct: 0 },
        { q: 'Какой жанр у басни?', options: ['Роман', 'Ода', 'Басня', 'Эпопея'], correct: 2 },
        { q: 'Что такое эпитет?', options: ['Сравнение', 'Красочное определение', 'Глагол', 'Союз'], correct: 1 }
      ],
      history: [
        { q: 'Кто был первым президентом России?', options: ['Ельцин', 'Путин', 'Ленин', 'Сталин'], correct: 0 },
        { q: 'В каком веке началась Великая Отечественная война?', options: ['XIX', 'XX', 'XVIII', 'XXI'], correct: 1 },
        { q: 'Кто открыл Америку?', options: ['Колумб', 'Пётр I', 'Наполеон', 'Магеллан'], correct: 0 },
        { q: 'Когда был основан Санкт-Петербург?', options: ['1703', '1801', '1654', '1760'], correct: 0 }
      ],
      biology: [
        { q: 'Чем дышат растения?', options: ['Лишь водой', 'Углекислым газом', 'Метаном', 'Кислородом'], correct: 1 },
        { q: 'Кровь переносит?', options: ['Только воду', 'Кислород и питательные вещества', 'Только углекислый газ', 'Ничего'], correct: 1 },
        { q: 'Кто такой хищник?', options: ['Ест растения', 'Ест других животных', 'Не питается', 'Питается грибами'], correct: 1 },
        { q: 'Где происходит фотосинтез?', options: ['В корнях', 'В листьях', 'В цветах', 'В почве'], correct: 1 }
      ],
      geography: [
        { q: 'Самая большая страна мира?', options: ['Канада', 'Китай', 'Россия', 'США'], correct: 2 },
        { q: 'Какая планета самая большая?', options: ['Марс', 'Юпитер', 'Венера', 'Меркурий'], correct: 1 },
        { q: 'Что такое пустыня?', options: ['Большой лес', 'Очень сухая территория', 'Озеро', 'Болото'], correct: 1 },
        { q: 'Как называется линия, отделяющая северное и южное полушарие?', options: ['Меридиан', 'Экватор', 'Параллель', 'Тропик'], correct: 1 }
      ],
      physics: [
        { q: 'Что такое ускорение?', options: ['Скорость без направления', 'Изменение скорости', 'Масса тела', 'Сила притяжения'], correct: 1 },
        { q: 'Какая единица измерения силы?', options: ['грамм', 'джоуль', 'ньютон', 'секунда'], correct: 2 },
        { q: 'Как движется тело при отсутствии силы?', options: ['Остановится', 'Равномерно и прямолинейно', 'Ускорится вниз', 'Повернётся'], correct: 1 },
        { q: 'Что измеряет термометр?', options: ['Давление', 'Температуру', 'Силу', 'Скорость'], correct: 1 }
      ],
      chemistry: [
        { q: 'Какой газ поддерживает горение?', options: ['Кислород', 'Азот', 'Углекислый газ', 'Водород'], correct: 0 },
        { q: 'Какая формула воды?', options: ['O2', 'CO2', 'H2O', 'NaCl'], correct: 2 },
        { q: 'Что находится в центре атома?', options: ['Электрон', 'Протон', 'Ядро', 'Нейтрон'], correct: 2 },
        { q: 'Какой элемент обозначается Fe?', options: ['Фосфор', 'Железо', 'Фтор', 'Феррий'], correct: 1 }
      ],
      english: [
        { q: 'Translate: Hello', options: ['Пока', 'Привет', 'Дом', 'Солнце'], correct: 1 },
        { q: 'How are you?', options: ['Как дела?', 'Где ты?', 'Что это?', 'Пойдём'], correct: 0 },
        { q: 'The word "book" means:', options: ['книга', 'дом', 'море', 'вода'], correct: 0 },
        { q: 'Choose the correct plural: "child"', options: ['childs', 'childes', 'children', 'child'], correct: 2 }
      ]
    };

    const teacherCode = '1234';
    let currentScreen = 'mainScreen';
    let gameState = null;
    let timerId = null;
    let cloudEnabled = false;
    let firestore = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
      currentScreen = id;
    }

    function setCloudStatus(mode, text) {
      const el = document.getElementById('cloudStatus');
      el.className = 'cloud-status';
      if (mode === 'ok') el.classList.add('ok');
      if (mode === 'err') el.classList.add('err');
      if (mode === 'wait') el.classList.add('wait');
      el.textContent = text;
    }

    function initFirebase() {
      try {
        if (!window.firebaseConfig || !window.firebaseConfig.apiKey || !window.firebaseConfig.projectId) {
          setCloudStatus('wait', 'Локальный режим');
          return;
        }
        const firebaseApp = firebase.initializeApp(window.firebaseConfig);
        firestore = firebase.firestore();
        cloudEnabled = true;
        setCloudStatus('ok', 'Firebase OK');
      } catch (e) {
        cloudEnabled = false;
        setCloudStatus('err', 'Firebase OFF');
      }
    }

    function saveJournalEntry(entry) {
      const data = {
        student: entry.student,
        className: entry.className,
        subject: entry.subject,
        result: entry.result,
        timestamp: new Date().toISOString(),
        mode: entry.mode || 'bot'
      };

      if (!cloudEnabled || !firestore) {
        const key = 'arena-duel-local-journal';
        let arr = JSON.parse(localStorage.getItem(key) || '[]');
        arr.unshift(data);
        localStorage.setItem(key, JSON.stringify(arr));
        return Promise.resolve();
      }

      return firestore.collection('journal').add(data).catch(() => {
        const key = 'arena-duel-local-journal';
        let arr = JSON.parse(localStorage.getItem(key) || '[]');
        arr.unshift(data);
        localStorage.setItem(key, JSON.stringify(arr));
      });
    }

    function renderJournal() {
      const box = document.getElementById('journalList');
      const query = (document.getElementById('journalSearch') || {}).value || '';
      const rows = JSON.parse(localStorage.getItem('arena-duel-local-journal') || '[]');

      const filtered = rows.filter(item => {
        const text = `${item.student || ''} ${item.className || ''} ${item.subject || ''}`.toLowerCase();
        return text.includes(query.toLowerCase());
      });

      if (!filtered.length) {
        box.innerHTML = '<div class="empty">Пока нет записей в журнале</div>';
        return;
      }

      box.innerHTML = filtered.map(item => `
        <div class="journal-entry">
          <strong>${item.student}</strong><br>
          Класс: ${item.className || '-'}<br>
          Предмет: ${SUBJECT_MAP[item.subject] || item.subject}<br>
          Результат: ${item.result}<br>
          Время: ${new Date(item.timestamp).toLocaleString('ru-RU')}
        </div>
      `).join('');
    }

    function setTeacherInfo() {
      const name = (document.getElementById('teacherName') || {}).value || 'Учитель';
      document.getElementById('teacherInfoBox').innerHTML = `<strong>${name}</strong> — журнал результатов`;
    }

    function goToMode() {
      const name = document.getElementById('studentName').value.trim();
      const cls = document.getElementById('studentClass').value.trim();
      if (!name || !cls) {
        alert('Введите имя и класс');
        return;
      }
      showScreen('modeScreen');
    }

    function loginTeacher() {
      const name = document.getElementById('teacherName').value.trim();
      const pin = document.getElementById('teacherPin').value.trim();
      if (!name || !pin) {
        alert('Введите имя учителя и PIN');
        return;
      }
      if (pin !== teacherCode) {
        alert('Неверный PIN');
        return;
      }
      setTeacherInfo();
      renderJournal();
      showScreen('teacherPanel');
    }

    function startBotGame(difficulty) {
      const name = document.getElementById('studentName').value.trim() || 'Игрок';
      const cls = document.getElementById('studentClass').value.trim() || '—';
      const subject = document.getElementById('subjectSelect').value;

      gameState = {
        mode: 'bot',
        difficulty,
        subject,
        player1: name,
        player2: 'Бот',
        className: cls,
        player1Score: 0,
        player2Score: 0,
        currentIndex: 0,
        currentQuestion: null,
        isLocked: false,
        totalQuestions: 4
      };

      startGameSession();
      showScreen('gameScreen');
    }

    function startDuelGame() {
      const p1 = document.getElementById('player1Name').value.trim() || 'Игрок 1';
      const p2 = document.getElementById('player2Name').value.trim() || 'Игрок 2';
      const subject = document.getElementById('duelSubject').value;

      gameState = {
        mode: 'duel',
        subject,
        player1: p1,
        player2: p2,
        className: '—',
        player1Score: 0,
        player2Score: 0,
        currentIndex: 0,
        currentQuestion: null,
        isLocked: false,
        totalQuestions: 4
      };

      startGameSession();
      showScreen('gameScreen');
    }

    function startGameSession() {
      const qPool = QUESTION_BANK[gameState.subject] || QUESTION_BANK.math;
      const max = qPool.length;
      gameState.questions = [...qPool].slice(0, Math.min(max, gameState.totalQuestions));
      gameState.currentIndex = 0;
      renderScores();
      renderQuestion();
    }

    function renderScores() {
      document.getElementById('player1Label').textContent = gameState.player1;
      document.getElementById('player2Label').textContent = gameState.player2;
      document.getElementById('player1Score').textContent = gameState.player1Score;
      document.getElementById('player2Score').textContent = gameState.player2Score;
    }

    function renderQuestion() {
      if (!gameState || gameState.currentIndex >= gameState.questions.length) {
        finishGame();
        return;
      }

      clearInterval(timerId);
      const q = gameState.questions[gameState.currentIndex];
      gameState.currentQuestion = q;
      gameState.isLocked = false;

      const questionEl = document.getElementById('questionText');
      questionEl.textContent = `${gameState.currentIndex + 1}. ${q.q}`;

      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';
      q.options.forEach((option, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.type = 'button';
        btn.textContent = `${String.fromCharCode(65 + idx)}. ${option}`;
        btn.onclick = () => answerQuestion(idx);
        optionsGrid.appendChild(btn);
      });

      document.getElementById('feedbackBox').className = 'feedback';
      document.getElementById('feedbackBox').style.display = 'none';
      document.getElementById('feedbackBox').textContent = '';

      let seconds = 15;
      document.getElementById('timer').textContent = seconds;
      timerId = setInterval(() => {
        seconds -= 1;
        document.getElementById('timer').textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timerId);
          answerQuestion(-1, true);
        }
      }, 1000);
    }

    function answerQuestion(index, timeout = false) {
      if (!gameState || gameState.isLocked) return;
      gameState.isLocked = true;
      clearInterval(timerId);

      const q = gameState.currentQuestion;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        if (index === i && i !== q.correct) btn.classList.add('wrong');
      });

      const feedback = document.getElementById('feedbackBox');
      if (timeout) {
        feedback.textContent = '⏰ Время вышло!';
        feedback.className = 'feedback wrong';
        feedback.style.display = 'block';
      } else if (index === q.correct) {
        feedback.textContent = '✅ Верно!';
        feedback.className = 'feedback correct';
        feedback.style.display = 'block';
        if (gameState.player1 === 'Бот' || gameState.mode === 'duel') {
          // not used
        }
        if (gameState.mode === 'bot') {
          gameState.player1Score += 1;
        } else {
          // duel mode: assign to current turn for player 1 or player 2 by parity
          if (gameState.currentIndex % 2 === 0) {
            gameState.player1Score += 1;
          } else {
            gameState.player2Score += 1;
          }
        }
      } else {
        feedback.textContent = '❌ Неверно!';
        feedback.className = 'feedback wrong';
        feedback.style.display = 'block';
        if (gameState.mode === 'duel' && gameState.currentIndex % 2 !== 0) {
          gameState.player1Score += 0;
        }
      }

      renderScores();
      setTimeout(() => {
        gameState.currentIndex += 1;
        renderQuestion();
      }, 1000);
    }

    function finishGame() {
      clearInterval(timerId);
      const p1 = gameState.player1Score;
      const p2 = gameState.player2Score;
      let winner = 'Ничья';
      if (p1 > p2) winner = gameState.player1;
      else if (p2 > p1) winner = gameState.player2;

      document.getElementById('winnerText').textContent = winner;
      document.getElementById('finalScoreText').textContent = `${gameState.player1}: ${p1} — ${gameState.player2}: ${p2}`;

      const entry = {
        student: gameState.player1,
        className: gameState.className || '—',
        subject: gameState.subject,
        result: `${p1}:${p2} — ${winner}`,
        mode: gameState.mode
      };

      saveJournalEntry(entry);
      renderJournal();
      showScreen('resultScreen');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initFirebase();
      renderJournal();
      showScreen('mainScreen');
    });
  </script>
</body>
</html>
